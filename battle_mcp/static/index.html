<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f5f2ea">
  <title>光点计划 III · 对战房间</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="mast"><div class="wrap line">
    <h1>光点计划 <small>III</small></h1>
    <div class="toolbar"><span id="seat" class="seat">连接中</span><a id="manual-desk" hidden>复制对战台</a><button id="rules" type="button">查规则</button></div>
  </div></header>
  <main class="wrap">
    <div class="line round"><h2 id="round">对战房间</h2><span id="phase"></span>
      <button id="pause-game" type="button" hidden>暂停并行动</button>
    </div>
    <div id="teams" class="teams" aria-label="双方战况"></div>
    <p id="connection" role="status" hidden></p>
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="lobby" aria-labelledby="lobby-title" hidden>
      <h2 id="lobby-title">我的出战角色</h2>
      <div class="lobby-row">
        <label for="fighter-pick">选择角色<select id="fighter-pick"></select></label>
        <div class="toolbar">
          <button id="lobby-catalog" type="button">查看双方技能</button>
          <button id="lobby-ready" class="primary" type="button">确认角色并准备</button>
        </div>
      </div>
      <p id="lobby-note" class="muted"></p>
    </section>
    <div class="columns">
      <div class="board">
        <section id="board-area"><h2>交锋区</h2>
          <p id="clash" class="clash" hidden></p>
          <ul id="duels" class="rows"></ul><p id="empty-board" class="muted">尚未置卡</p>
        </section>
        <section id="hand-area" hidden><h2>我的手牌</h2><ul id="hand" class="cards"></ul><p id="empty-hand" class="muted" hidden>手中无牌</p></section>
        <section><h2>战况记录</h2><ol id="history" class="history"></ol><p id="empty-history" class="muted">等待对局开始</p></section>
      </div>
      <aside id="station" hidden>
        <section id="decision" hidden><div class="line"><h2>轮到你决定</h2></div>
          <p id="decision-note"></p><div id="options" class="choices"></div>
        </section>
        <section id="playback"><div class="line"><h2>对局控制</h2><span id="prepared" class="muted"></span></div>
          <p id="pause-note" role="status"></p>
          <button id="ready" class="primary" type="button">准备</button>
        </section>
      </aside>
    </div>
    <noscript>请启用 JavaScript 以查看对局。</noscript>
  </main>
  <dialog id="book" aria-labelledby="book-title"><div class="line"><h2 id="book-title">规则与卡面</h2><button id="close" type="button">关闭</button></div>
    <div id="rule-topics" class="toolbar"></div><article id="rule-content"></article>
  </dialog>
  <template id="team-template"><article class="team">
    <div class="line"><span class="team-side"></span><span class="team-faction"></span></div>
    <div class="line"><h3></h3><span class="hp"></span></div>
    <progress aria-label="剩余生命" max="1" value="0"></progress>
    <p class="team-stats"></p><p class="statuses" hidden></p>
  </article></template>
</body>
</html>
