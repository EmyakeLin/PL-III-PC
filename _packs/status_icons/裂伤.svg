<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="裂伤">
  <title>裂伤</title>
  <!-- 通用状态「裂伤」：不绑定任何角色色板，采用纯粹深血红 × 鲜猩红 × 炽白蓄伤内芯的深层撕裂创口 -->
  <!-- 横向撕裂迸出的副创口裂刺 -->
  <polygon fill="#7F1D2A" points="3.8,10.2 16.6,14.2 28.2,21.8 15.4,17.8"/>
  <polygon fill="#9F122C" points="10.2,4.6 17.2,14.8 21.8,27.4 14.8,17.2"/>

  <!-- 45° 主撕裂创口：左上受光鲜猩红唇 (#DC2626) + 右下深暗血红唇 (#7F1D2A) -->
  <polygon fill="#DC2626" points="2.4,29.6 9.4,17.2 12.4,18.0 13.8,9.4 29.6,2.4 16.0,16.0"/>
  <polygon fill="#7F1D2A" points="29.6,2.4 22.6,14.8 19.6,14.0 18.2,22.6 2.4,29.6 16.0,16.0"/>

  <!-- 创口内壁鲜红与暗绛切面层次 -->
  <polygon fill="#EF4444" points="13.8,9.4 29.6,2.4 19.8,12.2 12.4,18.0"/>
  <polygon fill="#580E1A" points="18.2,22.6 2.4,29.6 12.2,19.8 19.6,14.0"/>

  <!-- 创口深处积蓄待爆的穿甲内伤核心（浅绯红晕 #FDA4AF + 炽白亮芯 #FFFDF8） -->
  <polygon fill="#FDA4AF" points="6.8,25.2 12.6,17.4 14.6,17.8 15.6,12.2 25.2,6.8 19.4,14.6 17.4,14.2 16.4,19.8"/>
  <polygon fill="#FFFDF8" points="10.2,21.8 14.4,16.6 15.8,16.8 16.4,13.8 21.8,10.2 17.6,15.4 16.2,15.2 15.6,18.2"/>
</svg>
