<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="折影">
  <title>折影</title>
  <!-- 折影：硬朗斜切倒角技能牌被 45° 空间裂隙切入虚空夹层，左上新牌吞入、右下旧牌错位沉回牌堆底 -->
  <defs>
    <clipPath id="fold_upper">
      <polygon points="0,0 32,0 32,3.8 3.8,32 0,32"/>
    </clipPath>
    <clipPath id="fold_lower">
      <polygon points="32,7.8 32,32 7.8,32"/>
    </clipPath>
  </defs>

  <!-- 1. 左上方：正被吞入虚空夹层的实体技能牌（45° 硬朗倒角几何牌面，零圆角，契合全套冷冽切面美学） -->
  <g clip-path="url(#fold_upper)">
    <g transform="translate(13.2 13.4) rotate(-14)">
      <!-- 硬朗八边倒角深钴蓝外牌框 -->
      <polygon fill="#1D4ED8" points="-6.0,-10.8 6.0,-10.8 8.0,-8.8 8.0,8.8 6.0,10.8 -6.0,10.8 -8.0,8.8 -8.0,-8.8"/>
      <!-- 内牌面：纯净天蓝与深蓝对角切面 -->
      <polygon fill="#38BDF8" points="-5.0,-8.8 5.0,-8.8 6.0,-7.8 6.0,7.8 -5.0,8.8 -6.0,7.8 -6.0,-7.8"/>
      <polygon fill="#2563EB" points="6.0,-7.8 6.0,7.8 -5.0,8.8 -6.0,7.8"/>
      <!-- 技能牌顶栏横铭与中心四芒牌印 -->
      <polygon fill="#E0F7FF" points="-4.2,-6.8 4.2,-6.8 4.2,-5.0 -4.2,-5.0"/>
      <path fill="#FFFDF8" d="M0 -3.2 L1.1 -0.3 L4.0 0.8 L1.1 1.9 L0 4.8 L-1.1 1.9 L-4.0 0.8 L-1.1 -0.3 Z"/>
    </g>
  </g>

  <!-- 2. 右下方：从夹层另一端错位挤出、向牌堆底沉降的旧技能折影牌尾与递减余影层 -->
  <g clip-path="url(#fold_lower)">
    <g transform="translate(18.8 17.8) rotate(-14)">
      <!-- 错位折影牌框（深邃暗紫 #4C1D95 × 空间棱紫 #7C3AED） -->
      <polygon fill="#4C1D95" points="-5.8,-10.4 5.8,-10.4 7.6,-8.6 7.6,8.2 5.8,10.0 -5.8,10.0 -7.6,8.2 -7.6,-8.6"/>
      <polygon fill="#7C3AED" points="-5.6,-8.2 5.6,-8.2 5.6,7.4 4.4,8.4 -4.4,8.4 -5.6,7.4"/>
      <polygon fill="#5B21B6" points="5.6,-8.2 5.6,7.4 4.4,8.4 -4.4,8.4 -5.6,7.4"/>
      <polygon fill="#F472B6" points="0,-1.8 2.4,1.2 0,4.2 -2.4,1.2" opacity="0.9"/>
      <!-- 牌底下方两道平行递减的沉降折影薄片（表现旧牌沉回牌堆底） -->
      <polygon fill="#9333EA" points="-5.2,11.6 5.2,11.6 4.2,13.0 -4.2,13.0"/>
    </g>
  </g>

  <!-- 3. 中央贯穿：撕开虚空夹层的 45° 锋芒品红 × 深紫空间切割裂隙 -->
  <polygon fill="#5B21B6" points="2.0,30.0 14.1,15.3 30.0,2.0 17.9,16.7"/>
  <polygon fill="#EC2892" points="2.0,30.0 15.0,14.6 30.0,2.0 17.0,17.4"/>
  <polygon fill="#FFFDF8" points="8.2,23.8 15.6,15.6 23.8,8.2 16.4,16.4"/>
</svg>
