<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="破甲">
  <title>破甲</title>
  <!-- 通用状态「破甲」：玄铁精钢六棱重盾被一道 45° 破防猩红斩光一击贯穿，上下两半沿切口错位滑移崩解 -->
  <defs>
    <clipPath id="shatter_upper">
      <polygon points="0,0 32,0 32,2.2 2.2,32 0,32"/>
    </clipPath>
    <clipPath id="shatter_lower">
      <polygon points="32,6.4 32,32 6.4,32"/>
    </clipPath>
  </defs>

  <!-- 左上半块：向左上方 (-1.1, -1.1) 错位滑移的精钢受击盾体 -->
  <g clip-path="url(#shatter_upper)">
    <g transform="translate(-1.1 -1.1)">
      <polygon fill="#948B7E" points="16.0,3.0 5.4,7.4 5.4,16.8 16.0,28.8"/>
      <polygon fill="#635A4F" points="16.0,3.0 26.6,7.4 26.6,16.8 16.0,28.8"/>
      <polygon fill="#E6DFD3" points="16.0,6.6 8.8,9.6 8.8,15.8 16.0,24.0"/>
      <polygon fill="#786E62" points="16.0,6.6 23.2,9.6 23.2,15.8 16.0,24.0"/>
    </g>
  </g>

  <!-- 右下半块：向右下方 (+1.3, +1.3) 崩落错位的暗铁断盾与飞溅残甲 -->
  <g clip-path="url(#shatter_lower)">
    <g transform="translate(1.3 1.3)">
      <polygon fill="#6E655A" points="16.0,3.0 5.4,7.4 5.4,16.8 16.0,28.8"/>
      <polygon fill="#453E37" points="16.0,3.0 26.6,7.4 26.6,16.8 16.0,28.8"/>
      <polygon fill="#5C5349" points="16.0,6.6 23.2,9.6 23.2,15.8 16.0,24.0"/>
    </g>
    <polygon fill="#857B6E" points="26.8,21.0 30.0,22.2 27.8,25.0"/>
  </g>

  <!-- 贯穿全盾的 45° 通用破防绛红斩裂线 -->
  <polygon fill="#C9233B" points="2.2,29.8 14.8,14.8 29.8,2.2 17.2,17.2"/>
  <polygon fill="#FFFDF8" points="7.6,24.4 15.6,15.6 24.4,7.6 16.4,16.4"/>
</svg>
