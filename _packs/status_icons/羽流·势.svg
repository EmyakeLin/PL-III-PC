<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="羽流·势">
  <title>羽流·势</title>
  <!-- 羽流·势（特殊主色：锋芒品红 × 瑰紫，竖直聚拢双羽抱剑核，区别于四剑式的蓝色主干） -->
  <path fill="none" stroke="#9333EA" stroke-width="1.45" stroke-linecap="round" d="M6.0 10.4 A11.4 11.4 0 0 0 8.2 24.4 M26.0 10.4 A11.4 11.4 0 0 1 23.8 24.4"/>
  <!-- 左侧折面聚势锐羽 -->
  <polygon fill="#EC2892" points="6.6,7.2 13.5,15.2 13.5,24.4 8.8,19.2"/>
  <polygon fill="#7E22CE" points="8.8,19.2 13.5,24.4 13.5,28.2 7.4,22.0"/>
  <!-- 右侧折面聚势锐羽 -->
  <polygon fill="#7E22CE" points="25.4,7.2 18.5,15.2 18.5,24.4 23.2,19.2"/>
  <polygon fill="#EC2892" points="23.2,19.2 18.5,24.4 18.5,28.2 24.6,22.0"/>
  <!-- 中央竖直蓄势主棱针 + 纯净天蓝坍缩原点 -->
  <polygon fill="#F43F9E" points="16,2.2 16,29.8 13.8,16.2"/>
  <polygon fill="#6D28D9" points="16,2.2 18.2,16.2 16,29.8"/>
  <polygon fill="#38BDF8" points="16,12.0 18.0,16.2 16,20.4 14.0,16.2"/>
  <polygon fill="#FFFDF8" points="16,14.2 16.9,16.2 16,18.2 15.1,16.2"/>
</svg>
