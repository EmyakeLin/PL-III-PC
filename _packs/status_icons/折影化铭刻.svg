<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="折影化铭刻">
  <title>折影化铭刻</title>
  <defs>
    <mask id="echo_cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect x="0" y="0" width="32" height="32" fill="white"/>
      <!-- 对称平行菱形遮罩（斜率严格 1.25，法向边距上下严格相等为 1.18px，右顶点 22.90 刚好停在深紫右臂内斜边 22.92 左侧，分毫不削薄深紫臂！） -->
      <polygon fill="black" points="11.8,3.92 0.70,17.8 11.8,31.68 22.90,17.8"/>
    </mask>
  </defs>
  <!-- 底层折影圣徽（中心 20.0, 14.2，上下四臂壁厚严格对称均为完整 3.8px，内外斜率严格 1.25） -->
  <g mask="url(#echo_cutout)">
    <polygon fill="#EC2892" points="20.0,2.2 11.2,13.2 15.0,13.2 20.0,6.95"/>
    <polygon fill="#7C3AED" points="20.0,2.2 28.8,13.2 25.0,13.2 20.0,6.95"/>
    <polygon fill="#9333EA" points="20.0,26.2 11.2,15.2 15.0,15.2 20.0,21.45"/>
    <polygon fill="#5B21B6" points="20.0,26.2 28.8,15.2 25.0,15.2 20.0,21.45"/>
    <polygon fill="#EC2892" points="20.0,8.6 15.8,16.0 20.0,19.2 24.2,16.0"/>
    <path fill="#FBCFE8" d="M20.0 10.0 L20.7 13.5 L24.2 14.2 L20.7 14.9 L20.0 18.4 L19.3 14.9 L15.8 14.2 L19.3 13.5 Z"/>
  </g>
  <polygon fill="#EC2892" points="29.5,15.6 30.9,18.4 29.5,21.2 28.1,18.4"/>
  <!-- 前景蓝色铭刻本体（中心 11.8, 17.8，上下四臂壁厚同样严格为完整 3.8px，内外斜率严格 1.25） -->
  <polygon fill="#38BDF8" points="2.0,11.0 3.3,13.6 2.0,16.2 0.7,13.6"/>
  <polygon fill="#38BDF8" points="11.8,5.8 3.0,16.8 6.8,16.8 11.8,10.55"/>
