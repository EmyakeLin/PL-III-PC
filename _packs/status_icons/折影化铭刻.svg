  <polygon fill="#1E3A8A" points="11.8,29.8 20.6,18.8 16.8,18.8 11.8,25.05"/>
  <polygon fill="#38BDF8" points="11.8,12.2 7.6,19.6 11.8,22.6"/>
  <polygon fill="#1D4ED8" points="11.8,12.2 16.0,19.6 11.8,22.6"/>
  <polygon fill="#BAE6FD" points="11.8,12.9 8.3,19.1 15.3,19.1" opacity="0.88"/>
  <path fill="#FFFDF8" d="M11.8 13.8 L12.6 17.0 L15.8 17.8 L12.6 18.6 L11.8 21.8 L11.0 18.6 L7.8 17.8 L11.0 17.0 Z"/>
