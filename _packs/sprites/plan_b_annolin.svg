<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" data-foot="80,140">
  <defs>
    <linearGradient id="ann_body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#22A679"/>
      <stop offset="100%" stop-color="#147554"/>
    </linearGradient>
    <linearGradient id="ann_rib" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#5FD4A8"/>
      <stop offset="100%" stop-color="#1C946B"/>
    </linearGradient>
    <linearGradient id="ann_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5CF6B"/>
      <stop offset="100%" stop-color="#CC8B1C"/>
    </linearGradient>
  </defs>

  <!-- 1. Luminous Sunlit Halo -->
  <g id="bone_back_hair" data-pivot="80,82">
    <circle cx="80" cy="82" r="44" fill="#DEF7EC" fill-opacity="0.72" stroke="#1C946B" stroke-width="1.3" stroke-opacity="0.32"/>
  </g>

  <!-- 2. Airy Twin Emerald Wind Ribbons (Borderless Watercolor Flow) -->
  <g id="bone_cape_back" data-pivot="74,84">
    <path d="M 74 70 Q 40 52 16 70 Q 44 82 72 88 Z" fill="url(#ann_rib)" opacity="0.78"/>
    <path d="M 74 84 Q 44 102 22 118 Q 52 118 76 102 Z" fill="#1C946B" opacity="0.56"/>
    <path d="M 28 70 Q 48 76 68 76" fill="none" stroke="#FFFDF7" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- 3. Compact Sculpted Mantle Figurine (No Legs — Pure Minimal Chess-Piece Grace) -->
  <g id="bone_torso" data-pivot="80,114">
    <polygon points="80,66 104,98 96,138 62,138 56,96"
             fill="url(#ann_body)" stroke="#FFFDF7" stroke-width="2.0" stroke-linejoin="round"/>
    <!-- Bright Jade Inner Chevron -->
    <polygon points="80,74 93,98 80,116 68,98" fill="#DEF7EC" opacity="0.92"/>
    <!-- Subtle Gold Waist Seal -->
    <path d="M 62 128 L 96 128" stroke="url(#ann_gold)" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
    <polygon points="80,94 85,100 80,106 75,100" fill="url(#ann_gold)"/>
  </g>

  <!-- 4. Clean Ivory Sphere Head + Crisp Wind Hair-Crest -->
  <g id="bone_head" data-pivot="80,66">
    <circle cx="82" cy="54" r="14.5" fill="#FFFDF7" stroke="#3B322A" stroke-width="1.8"/>
    <path d="M 67 52 L 83 34 L 98 50 L 82 46 Z" fill="#1C946B"/>
    <polygon points="78,42 83,46 78,50 73,46" fill="url(#ann_gold)"/>
  </g>

  <!-- 5. Sweeping Emerald-Gold Wind Blade -->
  <g id="bone_weapon" data-pivot="92,102">
    <path d="M 90 100 Q 120 78 144 46 Q 130 90 98 110 Z"
          fill="#FFFDF7" stroke="#1C946B" stroke-width="2.0" stroke-linejoin="round"/>
    <line x1="95" y1="101" x2="138" y2="54" stroke="url(#ann_gold)" stroke-width="2.0" stroke-linecap="round"/>
    <circle cx="94" cy="103" r="3.2" fill="url(#ann_gold)"/>
  </g>
</svg>
