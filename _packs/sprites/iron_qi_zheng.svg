<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" data-foot="80,140">
  <defs>
    <linearGradient id="qz_body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#B0362F"/>
      <stop offset="100%" stop-color="#7A1F1B"/>
    </linearGradient>
    <linearGradient id="qz_steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A8F82"/>
      <stop offset="100%" stop-color="#61584E"/>
    </linearGradient>
    <linearGradient id="qz_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7CF65"/>
      <stop offset="100%" stop-color="#C98718"/>
    </linearGradient>
  </defs>

  <!-- 1. Boss Sunburst Halo -->
  <g id="bone_back_hair" data-pivot="80,82">
    <circle cx="80" cy="82" r="46" fill="#FBEBEA" fill-opacity="0.72" stroke="#D99B26" stroke-width="1.6" stroke-opacity="0.5"/>
    <polygon points="80,30 84,39 76,39" fill="#D99B26" opacity="0.85"/>
    <polygon points="28,82 37,78 37,86" fill="#D99B26" opacity="0.85"/>
    <polygon points="132,82 123,78 123,86" fill="#D99B26" opacity="0.85"/>
  </g>

  <!-- 2. Flowing Crimson Commander Banner Cape -->
  <g id="bone_cape_back" data-pivot="74,84">
    <path d="M 74 72 Q 36 80 20 128 L 66 126 Z" fill="#7A1F1B" opacity="0.82"/>
    <path d="M 28 120 L 64 120" stroke="url(#qz_gold)" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 3. Broad Armored Iron-Pact Commander Torso & Pauldron -->
  <g id="bone_torso" data-pivot="80,114">
    <polygon points="56,72 104,72 100,138 60,138"
             fill="url(#qz_body)" stroke="#FFFDF7" stroke-width="2.0" stroke-linejoin="round"/>
    <!-- Iron Chestplate & Gold Crest -->
    <polygon points="68,74 94,74 91,110 81,118 71,110" fill="url(#qz_steel)" stroke="#FFFDF7" stroke-width="1.4"/>
    <polygon points="81,82 87,94 81,106 75,94" fill="url(#qz_gold)"/>
    <!-- Heavy Steel-Gold Pauldron -->
    <rect x="46" y="68" width="24" height="16" rx="5" fill="url(#qz_steel)" stroke="url(#qz_gold)" stroke-width="1.8"/>
    <path d="M 62 128 L 98 128" stroke="url(#qz_gold)" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 4. Hexagonal Visored Commander Helm + Gold Crown Crest -->
  <g id="bone_head" data-pivot="80,66">
    <polygon points="82,39 95,46 95,61 82,68 69,61 69,46"
             fill="#FFFDF7" stroke="#3B322A" stroke-width="1.9" stroke-linejoin="round"/>
    <rect x="75" y="51" width="21" height="5.5" rx="2.5" fill="#9C322C"/>
    <polygon points="82,31 87,42 82,47 77,42" fill="url(#qz_gold)"/>
  </g>

  <!-- 5. Heavy Hooked Commander Saber -->
  <g id="bone_weapon" data-pivot="94,102">
    <path d="M 94 102 C 114 82 132 62 146 44 C 154 50 152 64 142 74 L 132 70 L 136 80 C 124 92 110 102 98 110 Z"
          fill="#FFFDF7" stroke="#9C322C" stroke-width="2.0" stroke-linejoin="round"/>
    <line x1="98" y1="100" x2="140" y2="56" stroke="url(#qz_gold)" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
