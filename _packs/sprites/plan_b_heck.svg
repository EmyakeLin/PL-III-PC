<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" data-foot="80,136">
  <defs>
    <linearGradient id="hk_body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#D65526"/>
      <stop offset="100%" stop-color="#963114"/>
    </linearGradient>
    <linearGradient id="hk_ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE07D"/>
      <stop offset="100%" stop-color="#EB8A1C"/>
    </linearGradient>
    <clipPath id="hk_tc"><path d="M 64 76 L 97 78 L 100 136 L 60 136 Z"/></clipPath>
    <clipPath id="hk_hc"><circle cx="80" cy="56" r="13.5"/></clipPath>
  </defs>

  <!-- 1. Ember Sunlit Halo & Rising Sparks -->
  <g id="bone_back_hair" data-pivot="80,86">
    <circle cx="80" cy="86" r="42" fill="#FEF0DF" fill-opacity="0.72" stroke="#C94E24" stroke-width="1.3" stroke-opacity="0.32"/>
    <polygon points="39,72 44,63 47,74 41,79" fill="url(#hk_ember)" opacity="0.88"/>
    <polygon points="33,102 39,93 42,104 35,109" fill="#D65526" opacity="0.70"/>
  </g>

  <!-- 2. Smoothly Draped Scorched Mantle -->
  <g id="bone_cape_back" data-pivot="70,82">
    <path d="M 72 80 Q 46 88 32 126 Q 52 130 72 120 Z" fill="#8C2F14" opacity="0.82"/>
    <path d="M 39 120 Q 54 122 70 115" fill="none" stroke="url(#hk_ember)" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 3. Grounded PlanB Ember Coat Torso (Clip-Perfect Border) -->
  <g id="bone_torso" data-pivot="80,136">
    <path d="M 64 76 L 97 78 L 100 136 L 60 136 Z" fill="url(#hk_body)"/>
    <g clip-path="url(#hk_tc)">
      <polygon points="80,78 91,99 80,115 69,99" fill="#FEF0DF" opacity="0.92"/>
      <polygon points="80,88 85,98 80,108 75,98" fill="url(#hk_ember)"/>
      <rect x="60" y="122" width="40" height="5.5" fill="#4A3C32"/>
      <rect x="76" y="120" width="8" height="9.5" rx="2" fill="url(#hk_ember)"/>
    </g>
    <path d="M 64 76 L 97 78 L 100 136 L 60 136 Z" fill="none" stroke="#FFFDF7" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <!-- 4. Ivory Head + Clipped Ember Visor + Clean Flame Crest -->
  <g id="bone_head" data-pivot="80,68">
    <circle cx="80" cy="56" r="13.5" fill="#FFFDF7"/>
    <g clip-path="url(#hk_hc)">
      <rect x="76" y="52.5" width="20" height="6" rx="2.5" fill="url(#hk_ember)"/>
    </g>
    <circle cx="80" cy="56" r="13.5" fill="none" stroke="#3B322A" stroke-width="1.8"/>
    <path d="M 69 47 L 75 35 L 82 43 L 90 36 L 91 47 Q 80 44 69 47 Z" fill="#C94E24"/>
  </g>

  <!-- 5. Igniting Ember Greatsword -->
  <g id="bone_weapon" data-pivot="98,102">
    <polygon points="97,102 145,54 150,61 102,109" fill="#FFFDF7" stroke="#C94E24" stroke-width="1.9" stroke-linejoin="round"/>
    <line x1="101" y1="101" x2="142" y2="61" stroke="url(#hk_ember)" stroke-width="3.0" stroke-linecap="round"/>
    <circle cx="99" cy="104" r="3.2" fill="url(#hk_ember)"/>
  </g>
</svg>
