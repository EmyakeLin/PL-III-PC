<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" data-foot="80,136">
  <defs>
    <linearGradient id="sl_body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#38878A"/>
      <stop offset="100%" stop-color="#225759"/>
    </linearGradient>
    <linearGradient id="sl_rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E68846"/>
      <stop offset="100%" stop-color="#B04D1E"/>
    </linearGradient>
    <clipPath id="sl_tc"><path d="M 62 76 L 98 76 L 102 136 L 58 136 Z"/></clipPath>
    <clipPath id="sl_hc"><circle cx="80" cy="56" r="13.5"/></clipPath>
  </defs>

  <!-- 1. Dockyard Rivet Ring Halo -->
  <g id="bone_back_hair" data-pivot="80,86">
    <circle cx="80" cy="86" r="44" fill="#EAF3F2" fill-opacity="0.74" stroke="#C9682E" stroke-width="1.5" stroke-opacity="0.48"/>
    <circle cx="80" cy="42" r="2.8" fill="#C9682E"/>
    <circle cx="36" cy="86" r="2.8" fill="#C9682E"/>
    <circle cx="124" cy="86" r="2.8" fill="#C9682E"/>
  </g>

  <!-- 2. Smoothly Draped Heavy Dockyard Coat Tail -->
  <g id="bone_cape_back" data-pivot="70,82">
    <path d="M 72 80 Q 46 88 32 126 Q 52 130 72 120 Z" fill="#225759" opacity="0.84"/>
    <path d="M 39 120 Q 54 122 70 115" fill="none" stroke="url(#sl_rust)" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 3. Grounded Broad Shipbreaker Coat + Clipped Harness + Fitted Shoulder Plate -->
  <g id="bone_torso" data-pivot="80,136">
    <path d="M 62 76 L 98 76 L 102 136 L 58 136 Z" fill="url(#sl_body)"/>
    <g clip-path="url(#sl_tc)">
      <line x1="60" y1="78" x2="100" y2="124" stroke="url(#sl_rust)" stroke-width="3.8"/>
      <line x1="58" y1="126" x2="102" y2="126" stroke="url(#sl_rust)" stroke-width="2.4"/>
    </g>
    <path d="M 62 76 L 98 76 L 102 136 L 58 136 Z" fill="none" stroke="#FFFDF7" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="54" y="74" width="18" height="12" rx="4.5" fill="#6B645C" stroke="url(#sl_rust)" stroke-width="1.6"/>
  </g>

  <!-- 4. Ivory Head + Clipped Dockyard Bandana & Teal Visor (Zero Protrusion!) -->
  <g id="bone_head" data-pivot="80,68">
    <circle cx="80" cy="56" r="13.5" fill="#FFFDF7"/>
    <g clip-path="url(#sl_hc)">
      <path d="M 65 48 Q 80 44 95 48 L 95 52 Q 80 48 65 52 Z" fill="url(#sl_rust)"/>
      <rect x="76" y="53" width="20" height="5.5" rx="2.4" fill="#2F7578"/>
    </g>
    <circle cx="80" cy="56" r="13.5" fill="none" stroke="#3B322A" stroke-width="1.8"/>
  </g>

  <!-- 5. Heavy Shipbreaker Cleaver (Cleanly on Front Flank) -->
  <g id="bone_weapon" data-pivot="98,102">
    <path d="M 97 104 L 145 50 L 152 66 L 103 111 Z" fill="#FFFDF7" stroke="#2F7578" stroke-width="2.0" stroke-linejoin="round"/>
    <line x1="101" y1="102" x2="142" y2="60" stroke="url(#sl_rust)" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</svg>
