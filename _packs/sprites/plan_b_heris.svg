<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" data-foot="80,136">
  <defs>
    <linearGradient id="hr_body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#DB5E2E"/>
      <stop offset="100%" stop-color="#A13B1A"/>
    </linearGradient>
    <linearGradient id="hr_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCE084"/>
      <stop offset="100%" stop-color="#DE921F"/>
    </linearGradient>
    <clipPath id="hr_tc"><path d="M 64 76 L 97 78 L 100 136 L 60 136 Z"/></clipPath>
    <clipPath id="hr_hc"><circle cx="80" cy="56" r="13.5"/></clipPath>
  </defs>

  <!-- 1. Ember Spark Halo -->
  <g id="bone_back_hair" data-pivot="80,86">
    <circle cx="80" cy="86" r="42" fill="#FEF1E2" fill-opacity="0.72" stroke="#D1542A" stroke-width="1.3" stroke-opacity="0.32"/>
    <polygon points="39,72 44,63 47,74 41,79" fill="url(#hr_gold)" opacity="0.88"/>
  </g>

  <!-- 2. Flowing Flame Scarf (Tucked Cleanly Behind Shoulder) -->
  <g id="bone_cape_back" data-pivot="70,82">
    <path d="M 74 80 Q 48 84 28 102" fill="none" stroke="url(#hr_gold)" stroke-width="5.6" stroke-linecap="round"/>
    <path d="M 72 88 Q 50 98 34 114" fill="none" stroke="#D1542A" stroke-width="3.4" stroke-linecap="round" opacity="0.68"/>
  </g>

  <!-- 3. Grounded Tactical Torso (Clip-Perfect Harness) -->
  <g id="bone_torso" data-pivot="80,136">
    <path d="M 64 76 L 97 78 L 100 136 L 60 136 Z" fill="url(#hr_body)"/>
    <g clip-path="url(#hr_tc)">
      <line x1="60" y1="78" x2="100" y2="124" stroke="url(#hr_gold)" stroke-width="3.6"/>
      <polygon points="81,92 87,100 81,108 75,100" fill="url(#hr_gold)"/>
    </g>
    <path d="M 64 76 L 97 78 L 100 136 L 60 136 Z" fill="none" stroke="#FFFDF7" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <!-- 4. Ivory Head + Clipped Brass Goggles (Zero Protrusion!) -->
  <g id="bone_head" data-pivot="80,68">
    <circle cx="80" cy="56" r="13.5" fill="#FFFDF7"/>
    <g clip-path="url(#hr_hc)">
      <rect x="66" y="50" width="28" height="4" fill="#3B322A" opacity="0.75"/>
      <circle cx="79" cy="52" r="4.4" fill="#7A6856" stroke="#3B322A" stroke-width="1.3"/>
      <circle cx="79" cy="52" r="2.3" fill="url(#hr_gold)"/>
      <circle cx="89" cy="52" r="4.0" fill="#7A6856" stroke="#3B322A" stroke-width="1.3"/>
      <circle cx="89" cy="52" r="2.1" fill="url(#hr_gold)"/>
    </g>
    <circle cx="80" cy="56" r="13.5" fill="none" stroke="#3B322A" stroke-width="1.8"/>
  </g>

  <!-- 5. Heavy Blazing Warhammer (Cleanly on Front Flank) -->
  <g id="bone_weapon" data-pivot="98,102">
    <line x1="96" y1="114" x2="128" y2="74" stroke="#3B322A" stroke-width="4.0" stroke-linecap="round"/>
    <rect x="112" y="54" width="30" height="20" rx="4" transform="rotate(-38 127 64)" fill="#7A6856" stroke="#D1542A" stroke-width="2.0"/>
    <line x1="120" y1="58" x2="135" y2="70" stroke="url(#hr_gold)" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>
