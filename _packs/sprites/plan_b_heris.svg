<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" data-foot="80,140">
  <defs>
    <linearGradient id="hr_body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#DB5E2E"/>
      <stop offset="100%" stop-color="#A13B1A"/>
    </linearGradient>
    <linearGradient id="hr_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCE084"/>
      <stop offset="100%" stop-color="#DE921F"/>
    </linearGradient>
  </defs>

  <!-- 1. Ember Spark Halo -->
  <g id="bone_back_hair" data-pivot="80,82">
    <circle cx="80" cy="82" r="44" fill="#FEF1E2" fill-opacity="0.72" stroke="#D1542A" stroke-width="1.3" stroke-opacity="0.34"/>
    <polygon points="34,72 40,62 43,74 36,79" fill="url(#hr_gold)" opacity="0.86"/>
  </g>

  <!-- 2. Flowing Flame Scarf -->
  <g id="bone_cape_back" data-pivot="74,84">
    <path d="M 74 72 Q 44 74 22 96" fill="none" stroke="url(#hr_gold)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 70 84 Q 44 96 28 112" fill="none" stroke="#D1542A" stroke-width="4.0" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 3. Compact Tactical Mantle -->
  <g id="bone_torso" data-pivot="80,114">
    <polygon points="58,72 103,76 98,138 62,138" fill="url(#hr_body)" stroke="#FFFDF7" stroke-width="2.0" stroke-linejoin="round"/>
    <line x1="63" y1="80" x2="96" y2="120" stroke="url(#hr_gold)" stroke-width="3.4" stroke-linecap="round"/>
    <polygon points="81,92 87,100 81,108 75,100" fill="url(#hr_gold)"/>
  </g>

  <!-- 4. Ivory Head + Brass Goggles -->
  <g id="bone_head" data-pivot="80,66">
    <circle cx="82" cy="54" r="14" fill="#FFFDF7" stroke="#3B322A" stroke-width="1.8"/>
    <circle cx="80" cy="50" r="5" fill="#7A6856" stroke="#3B322A" stroke-width="1.4"/>
    <circle cx="80" cy="50" r="2.8" fill="url(#hr_gold)"/>
    <circle cx="92" cy="50" r="4.6" fill="#7A6856" stroke="#3B322A" stroke-width="1.4"/>
    <circle cx="92" cy="50" r="2.5" fill="url(#hr_gold)"/>
  </g>

  <!-- 5. Heavy Blazing Warhammer ("重锤！") -->
  <g id="bone_weapon" data-pivot="94,102">
    <line x1="88" y1="118" x2="128" y2="68" stroke="#3B322A" stroke-width="4.4" stroke-linecap="round"/>
    <rect x="110" y="48" width="34" height="23" rx="4" transform="rotate(-38 127 59)" fill="#7A6856" stroke="#D1542A" stroke-width="2.0"/>
    <line x1="119" y1="53" x2="136" y2="67" stroke="url(#hr_gold)" stroke-width="3.6" stroke-linecap="round"/>
  </g>
</svg>
