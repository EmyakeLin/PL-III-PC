<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" data-foot="80,136">
  <defs>
    <linearGradient id="ll_body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#28998B"/>
      <stop offset="100%" stop-color="#176B61"/>
    </linearGradient>
    <linearGradient id="ll_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7D472"/>
      <stop offset="100%" stop-color="#CC8E1C"/>
    </linearGradient>
    <clipPath id="ll_tc"><path d="M 80 70 L 101 94 L 98 136 L 62 136 L 59 94 Z"/></clipPath>
    <clipPath id="ll_hc"><circle cx="80" cy="56" r="13.5"/></clipPath>
  </defs>

  <!-- 1. Energy Cycle Prism Halo -->
  <g id="bone_back_hair" data-pivot="80,86">
    <circle cx="80" cy="86" r="42" fill="#E8F6F2" fill-opacity="0.74" stroke="#208578" stroke-width="1.3" stroke-opacity="0.32"/>
    <polygon points="80,41 122,86 80,131 38,86" fill="none" stroke="url(#ll_gold)" stroke-width="1.2" opacity="0.55"/>
  </g>

  <!-- 2. Smooth Flowing Mobility Cape (No Awkward Stiff Triangle!) -->
  <g id="bone_cape_back" data-pivot="70,82">
    <path d="M 74 80 Q 44 84 26 124 Q 50 130 74 124 Z" fill="url(#ll_gold)" opacity="0.80"/>
    <path d="M 34 118 Q 52 122 72 118" fill="none" stroke="#208578" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- 3. Grounded PlanB Specialist Mantle -->
  <g id="bone_torso" data-pivot="80,136">
    <path d="M 80 70 L 101 94 L 98 136 L 62 136 L 59 94 Z" fill="url(#ll_body)"/>
    <g clip-path="url(#ll_tc)">
      <polygon points="80,76 92,99 80,116 68,99" fill="#E8F6F2" opacity="0.92"/>
      <circle cx="80" cy="98" r="5" fill="url(#ll_gold)"/>
      <line x1="58" y1="126" x2="102" y2="126" stroke="url(#ll_gold)" stroke-width="2.0" opacity="0.85"/>
    </g>
    <path d="M 80 70 L 101 94 L 98 136 L 62 136 L 59 94 Z" fill="none" stroke="#FFFDF7" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <!-- 4. Clean Ivory Head + Clipped Gold Visor -->
  <g id="bone_head" data-pivot="80,68">
    <circle cx="80" cy="56" r="13.5" fill="#FFFDF7"/>
    <g clip-path="url(#ll_hc)">
      <rect x="76" y="52.5" width="20" height="6" rx="2.5" fill="url(#ll_gold)"/>
    </g>
    <circle cx="80" cy="56" r="13.5" fill="none" stroke="#3B322A" stroke-width="1.8"/>
  </g>

  <!-- 5. Energy-Ringed Piercing Lance -->
  <g id="bone_weapon" data-pivot="98,102">
    <polygon points="95,94 150,74 96,105" fill="#FFFDF7" stroke="#208578" stroke-width="1.9" stroke-linejoin="round"/>
    <line x1="98" y1="99" x2="144" y2="76" stroke="url(#ll_gold)" stroke-width="2.0" stroke-linecap="round"/>
    <circle cx="118" cy="89" r="5.5" fill="none" stroke="url(#ll_gold)" stroke-width="1.9"/>
  </g>
</svg>
