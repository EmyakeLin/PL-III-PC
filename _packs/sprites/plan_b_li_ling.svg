<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" data-foot="80,140">
  <defs>
    <linearGradient id="ll_body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#28998B"/>
      <stop offset="100%" stop-color="#176B61"/>
    </linearGradient>
    <linearGradient id="ll_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7D472"/>
      <stop offset="100%" stop-color="#CC8E1C"/>
    </linearGradient>
  </defs>

  <!-- 1. Energy Cycle Prism Halo -->
  <g id="bone_back_hair" data-pivot="80,82">
    <circle cx="80" cy="82" r="44" fill="#E8F6F2" fill-opacity="0.74" stroke="#208578" stroke-width="1.3" stroke-opacity="0.34"/>
    <polygon points="80,36 124,82 80,128 36,82" fill="none" stroke="url(#ll_gold)" stroke-width="1.2" opacity="0.58"/>
  </g>

  <!-- 2. Sleek Winged Mobility Cape -->
  <g id="bone_cape_back" data-pivot="74,84">
    <polygon points="72,70 20,58 38,120 70,114" fill="url(#ll_gold)" opacity="0.78" stroke="#208578" stroke-width="1.3" stroke-linejoin="round"/>
  </g>

  <!-- 3. Poised PlanB Specialist Mantle -->
  <g id="bone_torso" data-pivot="80,114">
    <polygon points="80,66 104,96 96,138 62,138 56,96" fill="url(#ll_body)" stroke="#FFFDF7" stroke-width="2.0" stroke-linejoin="round"/>
    <polygon points="80,74 92,98 80,116 68,98" fill="#E8F6F2" opacity="0.92"/>
    <circle cx="80" cy="96" r="5" fill="url(#ll_gold)"/>
  </g>

  <!-- 4. Clean Ivory Head + Sleek Gold Visor -->
  <g id="bone_head" data-pivot="80,66">
    <circle cx="82" cy="54" r="14" fill="#FFFDF7" stroke="#3B322A" stroke-width="1.8"/>
    <rect x="78" y="49.5" width="19" height="6.5" rx="3" fill="url(#ll_gold)"/>
  </g>

  <!-- 5. Energy-Ringed Piercing Lance ("连环穿刺 / 贯彻长空") -->
  <g id="bone_weapon" data-pivot="94,102">
    <polygon points="88,88 154,68 90,100" fill="#FFFDF7" stroke="#208578" stroke-width="2.0" stroke-linejoin="round"/>
    <line x1="92" y1="94" x2="148" y2="70" stroke="url(#ll_gold)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="116" cy="84" r="6.5" fill="none" stroke="url(#ll_gold)" stroke-width="2.0"/>
  </g>
</svg>
