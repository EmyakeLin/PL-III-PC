<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" data-foot="80,140">
  <defs>
    <linearGradient id="bl_ivory" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#E8DEC8"/>
    </linearGradient>
    <linearGradient id="bl_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAE08C"/>
      <stop offset="100%" stop-color="#C29024"/>
    </linearGradient>
  </defs>

  <!-- 1. Blank Geometric Mirror Halo -->
  <g id="bone_back_hair" data-pivot="80,82">
    <circle cx="80" cy="82" r="46" fill="#FCF8EC" fill-opacity="0.78" stroke="url(#bl_gold)" stroke-width="1.6" stroke-opacity="0.65"/>
    <polygon points="80,36 126,82 80,128 34,82" fill="none" stroke="url(#bl_gold)" stroke-width="1.1" opacity="0.55"/>
  </g>

  <!-- 2. Flowing Parchment Veil -->
  <g id="bone_cape_back" data-pivot="74,84">
    <path d="M 74 72 Q 38 84 26 128 L 68 124 Z" fill="#E3D9C3" opacity="0.82"/>
    <path d="M 34 120 L 66 118" stroke="url(#bl_gold)" stroke-width="2.0" stroke-linecap="round"/>
  </g>

  <!-- 3. Kintsugi Porcelain Figurine Robe -->
  <g id="bone_torso" data-pivot="80,114">
    <polygon points="80,66 104,96 98,138 60,138 56,96"
             fill="url(#bl_ivory)" stroke="#9E927E" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Delicate Gold Kintsugi Seam -->
    <path d="M 74 78 L 84 96 L 74 114 L 90 132 M 94 92 L 84 96" fill="none" stroke="url(#bl_gold)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="80,94 86,102 80,110 74,102" fill="url(#bl_gold)"/>
  </g>

  <!-- 4. Pure Blank Porcelain Sphere + Floating Gold Halo Crown -->
  <g id="bone_head" data-pivot="80,66">
    <circle cx="82" cy="54" r="14.5" fill="#FFFDF8" stroke="#8C7E68" stroke-width="1.7"/>
    <circle cx="86" cy="54" r="5.5" fill="none" stroke="url(#bl_gold)" stroke-width="1.4"/>
    <ellipse cx="82" cy="34" rx="18" ry="4" fill="none" stroke="url(#bl_gold)" stroke-width="2.0"/>
  </g>

  <!-- 5. Floating Gilded Prism Blade -->
  <g id="bone_weapon" data-pivot="94,102">
    <polygon points="94,98 146,46 150,52 100,106"
             fill="#FFFFFF" stroke="#B89132" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="99" y1="98" x2="142" y2="54" stroke="url(#bl_gold)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="94,92 102,100 94,108 86,100" fill="url(#bl_gold)"/>
  </g>
</svg>
