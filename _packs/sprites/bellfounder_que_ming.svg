    <line x1="96" y1="114" x2="130" y2="72" stroke="#3B322A" stroke-width="3.8" stroke-linecap="round"/>
    <rect x="116" y="54" width="20" height="26" rx="6" transform="rotate(-42 126 67)" fill="url(#qm_bronze)" stroke="#3B322A" stroke-width="1.7"/>
