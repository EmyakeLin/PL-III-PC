    <path d="M 35 126 Q 54 127 72 123" fill="none" stroke="url(#qm_bronze)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 3. Grounded Bellfounder Artisan Robe -->
  <g id="bone_torso" data-pivot="80,136">
    <path d="M 80 70 L 101 94 L 98 136 L 62 136 L 59 94 Z" fill="url(#qm_body)"/>
    <g clip-path="url(#qm_tc)">
      <polygon points="80,76 92,99 80,116 68,99" fill="#EDF5F0" opacity="0.90"/>
