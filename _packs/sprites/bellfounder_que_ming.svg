  <!-- 1. Resonant Concentric Bronze Bell Halo -->
  <g id="bone_back_hair" data-pivot="80,86">
    <circle cx="80" cy="86" r="44" fill="#EDF5F0" fill-opacity="0.76" stroke="url(#qm_bronze)" stroke-width="1.5" stroke-opacity="0.62"/>
    <circle cx="80" cy="86" r="35" fill="none" stroke="#3D826E" stroke-width="1.2" stroke-dasharray="10 6" opacity="0.48"/>
  </g>

  <!-- 2. Artisan Bronze-Trimmed Mantle -->
  <g id="bone_cape_back" data-pivot="70,82">
