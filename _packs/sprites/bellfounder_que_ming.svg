    <ellipse cx="80" cy="36" rx="16" ry="3.6" fill="none" stroke="url(#qm_bronze)" stroke-width="2.0"/>
  </g>

  <!-- 5. Heavy Bronze Tuning Mallet (Cleanly on Front Flank) -->
