<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" data-foot="80,140">
  <defs>
    <linearGradient id="lq_body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#308C91"/>
      <stop offset="100%" stop-color="#1E6368"/>
    </linearGradient>
    <linearGradient id="lq_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAD978"/>
      <stop offset="100%" stop-color="#CC8E1E"/>
    </linearGradient>
  </defs>

  <!-- 1. Nova Astral Halo & Feather Wing Silhouettes -->
  <g id="bone_back_hair" data-pivot="80,82">
    <circle cx="80" cy="82" r="46" fill="#EDF6F5" fill-opacity="0.76" stroke="#E0A832" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M 68 62 Q 36 46 16 64 Q 42 74 68 72 Z" fill="#FFFDF7" stroke="#2B7E82" stroke-width="1.3"/>
    <path d="M 68 78 Q 38 78 20 98 Q 46 98 70 88 Z" fill="#5CB5B8" opacity="0.65"/>
  </g>

  <!-- 2. Flowing Nova Boss Mantle -->
  <g id="bone_cape_back" data-pivot="74,84">
    <path d="M 74 72 Q 40 84 26 128 L 68 124 Z" fill="#1E6368" opacity="0.78"/>
    <path d="M 32 120 L 66 118" stroke="url(#lq_gold)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 3. Split Ivory & Teal Astral Boss Robe -->
  <g id="bone_torso" data-pivot="80,114">
    <polygon points="80,66 104,96 98,138 60,138 56,96"
             fill="url(#lq_body)" stroke="#FFFDF7" stroke-width="2.0" stroke-linejoin="round"/>
    <polygon points="80,68 102,96 96,136 80,136" fill="#FFFDF7" opacity="0.92"/>
    <path d="M 62 128 L 96 128" stroke="url(#lq_gold)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="80,92 86,100 80,108 74,100" fill="url(#lq_gold)"/>
  </g>

  <!-- 4. Clean Ivory Head + Golden Feather Crown -->
  <g id="bone_head" data-pivot="80,66">
    <circle cx="82" cy="54" r="14.5" fill="#FFFDF7" stroke="#3B322A" stroke-width="1.8"/>
    <path d="M 72 48 L 52 36 L 78 40 L 94 46 Z" fill="url(#lq_gold)"/>
    <circle cx="88" cy="54" r="2.2" fill="#2B7E82"/>
  </g>

  <!-- 5. Feather-Guard Inscribing Sword -->
  <g id="bone_weapon" data-pivot="94,102">
    <polygon points="94,98 146,44 150,50 100,106"
             fill="#FFFDF7" stroke="#2B7E82" stroke-width="1.9" stroke-linejoin="round"/>
    <line x1="99" y1="97" x2="142" y2="52" stroke="url(#lq_gold)" stroke-width="2.0" stroke-linecap="round"/>
    <path d="M 88 92 L 106 108" stroke="url(#lq_gold)" stroke-width="3.6" stroke-linecap="round"/>
  </g>
</svg>
