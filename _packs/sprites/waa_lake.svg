<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" data-foot="80,140">
  <defs>
    <linearGradient id="lk_body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#D66431"/>
      <stop offset="100%" stop-color="#A63F1B"/>
    </linearGradient>
    <linearGradient id="lk_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7CC63"/>
      <stop offset="100%" stop-color="#D98B1E"/>
    </linearGradient>
  </defs>

  <!-- 1. Sunlit Halo -->
  <g id="bone_back_hair" data-pivot="80,82">
    <circle cx="80" cy="82" r="44" fill="#FEF2DC" fill-opacity="0.72" stroke="#C95A2B" stroke-width="1.3" stroke-opacity="0.32"/>
  </g>

  <!-- 2. Swept Tactical Amber Cape -->
  <g id="bone_cape_back" data-pivot="74,84">
    <polygon points="72,70 22,82 38,122 70,114" fill="url(#lk_gold)" opacity="0.82" stroke="#C95A2B" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- 3. Angular WAA Tactical Torso + Diagonal Brass Strap & Core -->
  <g id="bone_torso" data-pivot="80,114">
    <polygon points="60,72 103,76 98,138 62,138"
             fill="url(#lk_body)" stroke="#FFFDF7" stroke-width="2.0" stroke-linejoin="round"/>
    <line x1="64" y1="78" x2="96" y2="122" stroke="url(#lk_gold)" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="82" cy="96" r="7.5" fill="#FFFDF7" stroke="#E69E32" stroke-width="2.0"/>
    <circle cx="82" cy="96" r="3.2" fill="#E69E32"/>
  </g>

  <!-- 4. Clean Ivory Sphere Head + Tactical Amber Visor -->
  <g id="bone_head" data-pivot="80,66">
    <circle cx="82" cy="54" r="14" fill="#FFFDF7" stroke="#3B322A" stroke-width="1.8"/>
    <rect x="78" y="49" width="20" height="7.5" rx="3.2" fill="url(#lk_gold)"/>
  </g>

  <!-- 5. Forward Curved WAA Assault Saber -->
  <g id="bone_weapon" data-pivot="94,102">
    <polygon points="94,100 142,60 132,86 99,108"
             fill="#FFFDF7" stroke="#C95A2B" stroke-width="2.0" stroke-linejoin="round"/>
    <line x1="98" y1="99" x2="136" y2="66" stroke="url(#lk_gold)" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
