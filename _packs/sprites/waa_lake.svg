<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" data-foot="80,136">
  <defs>
    <linearGradient id="lk_body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#D66431"/>
      <stop offset="100%" stop-color="#A63F1B"/>
    </linearGradient>
    <linearGradient id="lk_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7CC63"/>
      <stop offset="100%" stop-color="#D98B1E"/>
    </linearGradient>
    <clipPath id="lk_tc"><path d="M 64 76 L 97 78 L 100 136 L 60 136 Z"/></clipPath>
    <clipPath id="lk_hc"><circle cx="80" cy="56" r="13.5"/></clipPath>
  </defs>

  <!-- 1. Soft Sunlit Halo -->
  <g id="bone_back_hair" data-pivot="80,86">
    <circle cx="80" cy="86" r="42" fill="#FEF2DC" fill-opacity="0.72" stroke="#C95A2B" stroke-width="1.3" stroke-opacity="0.30"/>
  </g>

  <!-- 2. Smoothly Draped Amber Field Cape (Tucked Cleanly Behind Shoulder) -->
  <g id="bone_cape_back" data-pivot="70,82">
    <path d="M 72 80 Q 46 88 32 126 Q 52 130 72 120 Z" fill="url(#lk_gold)" opacity="0.84"/>
    <path d="M 39 120 Q 54 122 70 115" fill="none" stroke="#FFFDF7" stroke-width="1.6" stroke-linecap="round" opacity="0.78"/>
  </g>

  <!-- 3. Grounded WAA Tactical Torso + Clipped Diagonal Harness & Core -->
  <g id="bone_torso" data-pivot="80,136">
    <path d="M 64 76 L 97 78 L 100 136 L 60 136 Z" fill="url(#lk_body)"/>
    <g clip-path="url(#lk_tc)">
      <line x1="60" y1="78" x2="100" y2="124" stroke="url(#lk_gold)" stroke-width="3.8"/>
      <circle cx="81" cy="100" r="7.2" fill="#FFFDF7" stroke="#E69E32" stroke-width="2.0"/>
      <circle cx="81" cy="100" r="3.0" fill="#E69E32"/>
    </g>
    <path d="M 64 76 L 97 78 L 100 136 L 60 136 Z" fill="none" stroke="#FFFDF7" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <!-- 4. Clean Ivory Head + Clipped Curved Amber Visor (Zero Protrusion!) -->
  <g id="bone_head" data-pivot="80,68">
    <circle cx="80" cy="56" r="13.5" fill="#FFFDF7"/>
    <g clip-path="url(#lk_hc)">
      <rect x="76" y="52.5" width="20" height="6.2" rx="2.6" fill="url(#lk_gold)"/>
    </g>
    <circle cx="80" cy="56" r="13.5" fill="none" stroke="#3B322A" stroke-width="1.8"/>
  </g>

  <!-- 5. Forward Curved WAA Assault Saber (Cleanly on Front Flank) -->
  <g id="bone_weapon" data-pivot="98,102">
    <polygon points="97,102 144,58 136,84 102,109" fill="#FFFDF7" stroke="#C95A2B" stroke-width="1.9" stroke-linejoin="round"/>
    <line x1="101" y1="101" x2="138" y2="66" stroke="url(#lk_gold)" stroke-width="2.1" stroke-linecap="round"/>
  </g>
</svg>
