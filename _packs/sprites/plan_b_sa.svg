      <stop offset="0%" stop-color="#BA3444"/>
      <stop offset="100%" stop-color="#781C28"/>
    </linearGradient>
    <linearGradient id="sa_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAD978"/>
      <stop offset="100%" stop-color="#C78A1C"/>
