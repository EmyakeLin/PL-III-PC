    <polygon points="80,35 84,43 76,43" fill="url(#sa_gold)"/>
    <polygon points="30,86 38,82 38,90" fill="url(#sa_gold)"/>
    <polygon points="130,86 122,82 122,90" fill="url(#sa_gold)"/>
  </g>

  <!-- 2. Sweeping Ceremonial Boss Cloak -->
